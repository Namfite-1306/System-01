<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Research Studio — News to Insight</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link id="workspace-theme" rel="stylesheet" href="/workspace-theme.css" />
    <link rel="stylesheet" href="/ui-language.css" />
    <script src="/theme.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Đến nội dung chính</a>
    <aside class="sidebar">
      <a class="brand" href="#events"
        ><span class="brand-icon">r<span>↗</span></span>
        <div>Research Studio</div></a
      >
      <nav aria-label="Điều hướng">
        <button data-page="events" class="active">
          <span>◫</span> Bàn tin tức <i id="event-count">0</i></button
        ><button data-page="timeline"><span>◷</span> Dòng sự kiện</button
        ><button data-page="graph"><span>⌘</span> Bản đồ liên kết</button
        ><button data-page="ecosystems"><span>▧</span> Hệ sinh thái</button>
        <button data-page="cases"><span>▤</span> Case & brief <i id="case-count">0</i></button
        ><button data-page="analyses"><span>✎</span> Bài viết</button
        ><button data-page="portfolio"><span>↗</span> Portfolio</button>
      </nav>
      <div class="sidebar-bottom">
        <button data-page="settings"><span>⚙</span> Nguồn & thiết lập</button>
        <div class="profile-mini">
          <span class="avatar">HN</span>
          <div>Hai Nam</div>
        </div>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div>
          <span class="breadcrumb">Không gian nghiên cứu</span><span class="separator">/</span
          ><span id="breadcrumb-current">Bàn tin tức</span>
        </div>
        <div class="top-meta">
          <button
            id="ui-language-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Switch interface to English"
            title="Ngôn ngữ giao diện: Việt / English"
          >
            <span aria-hidden="true">文</span><span id="ui-language-label">VI</span>
          </button>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Dùng giao diện sáng"
            title="Đổi giữa Obsidian & Lime và giao diện sáng"
          >
            <span aria-hidden="true">◐</span><span>Giao diện sáng</span>
          </button>
          <span id="connection" class="connection">Đang kết nối…</span><span id="today"></span>
        </div>
      </header>
      <main id="main" tabindex="-1"><div class="loading">Đang mở không gian nghiên cứu…</div></main>
      <footer>
        <a href="/landing.html">Giới thiệu Research Studio ↗</a>
      </footer>
    </div>
    <dialog id="detail-dialog"><div id="dialog-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
